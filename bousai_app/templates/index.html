{% extends "base.html" %}

{% block title %}防災情報 | 防災アプリ{% endblock %}

{% block content %}
<section class="dashboard-panel map-panel" aria-labelledby="map-title">
    <h2 id="map-title" class="panel-title"><span class="map-pin-icon" aria-hidden="true"></span>避難所マップ</h2>
    <div id="shelterMap" class="shelter-map" aria-label="避難所周辺の地図"></div>
</section>

<section class="dashboard-panel weather-panel" aria-labelledby="weather-title">
    <div class="weather-heading">
        <h2 id="weather-title"><span class="weather-icon" aria-hidden="true">☁</span>青森市 気象警報・注意報</h2>
        <p class="refresh-label"><span aria-hidden="true">⟳</span>10分おき自動更新</p>
    </div>
    <div id="weatherContent" class="weather-summary" aria-live="polite">
        <p class="weather-location"><span class="small-pin" aria-hidden="true"></span>青森市</p>
        <p class="loading-state"><span class="loading-dot"></span>気象情報を確認しています</p>
    </div>
</section>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期表示を青森市周辺に設定
    const map = L.map('shelterMap').setView([40.8222, 140.7474], 11);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = `
                <p class="weather-location"><span class="small-pin" aria-hidden="true"></span>${data.area_name || '青森市'}</p>
                <div class="weather-state is-error"><span class="state-mark">!</span><p>気象情報を取得できませんでした</p></div>
            `;
            return;
        }

        let statusHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            statusHtml = `
                <div class="weather-state is-warning">
                    <span class="state-mark">!</span>
                    <p>警報・注意報が発表されています</p>
                </div>
                <ul class="warning-list">
                    ${data.warnings.map(warning => `<li><span>${warning.name}</span><small>${warning.status}</small></li>`).join('')}
                </ul>
            `;
        } else {
            statusHtml = `
                <div class="weather-state is-clear">
                    <span class="state-mark">✓</span>
                    <p>現在、警報・注意報は発表されていません</p>
                </div>
            `;
        }

        weatherContent.innerHTML = `
            <p class="weather-location"><span class="small-pin" aria-hidden="true"></span>${data.area_name || '青森市'}</p>
            ${statusHtml}
            <dl class="weather-meta">
                <div><dt><span aria-hidden="true">◷</span>データ取得:</dt><dd id="lastFetchTime">${data.last_fetch_time || '更新中...'}</dd></div>
                <div><dt><span aria-hidden="true">◉</span>気象庁発表:</dt><dd>${data.report_time || '不明'}</dd></div>
            </dl>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
